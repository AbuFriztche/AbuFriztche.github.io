<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotifymate - Spotify Authorization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #121212 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px;
      max-width: 560px;
      width: 90%;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #1DB954, #1ed760);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #b3b3b3;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .code-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(29,185,84,0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      word-break: break-all;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: #1DB954;
      display: none;
    }
    .code-box.show { display: block; }
    .error-box {
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
      color: #ff6b6b;
      font-size: 14px;
    }
    .error-box.show { display: block; }
    .steps {
      text-align: left;
      margin-top: 24px;
      padding: 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      display: none;
    }
    .steps.show { display: block; }
    .steps ol {
      margin-left: 18px;
      color: #b3b3b3;
      font-size: 13px;
      line-height: 1.8;
    }
    .steps code {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #1DB954;
    }
    .copy-btn {
      background: #1DB954;
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }
    .copy-btn:hover { background: #1ed760; transform: scale(1.02); }
    .copy-btn.show { display: inline-block; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #1DB954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
      display: none;
    }
    .loader.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-block;
      background: rgba(29,185,84,0.15);
      color: #1DB954;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎵</div>
    <h1>Spotifymate</h1>
    <p class="subtitle">Spotify Authorization Callback</p>
    <div class="loader" id="loader"></div>
    <div class="code-box" id="code-box">
      <strong style="color:#fff;display:block;margin-bottom:8px;">✦ Authorization Code</strong>
      <span id="auth-code"></span>
    </div>
    <div class="error-box" id="error-box">
      <strong style="color:#fff;display:block;margin-bottom:8px;">✧ Authorization Failed</strong>
      <span id="error-msg"></span>
    </div>
    <button class="copy-btn" id="copy-btn">📋 Kodu Kopyala</button>
    <div class="steps" id="steps">
      <ol>
        <li>Kodu kopyala <code>Ctrl+C</code></li>
        <li>Terminal'e dön ve kodu yapıştır <code>Ctrl+V</code></li>
        <li>Enter'a bas, devam et!</li>
      </ol>
    </div>
    <div class="badge">✓ Callback aktif</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    const loader = document.getElementById('loader');
    const codeBox = document.getElementById('code-box');
    const authCode = document.getElementById('auth-code');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const copyBtn = document.getElementById('copy-btn');
    const steps = document.getElementById('steps');

    if (error) {
      loader.classList.remove('show');
      errorBox.classList.add('show');
      errorMsg.textContent = decodeURIComponent(error);
      if (error === 'access_denied') {
        errorMsg.textContent = 'Erişim reddedildi. Lütfen tekrar dene.';
      }
    } else if (code) {
      loader.classList.remove('show');
      codeBox.classList.add('show');
      authCode.textContent = code;
      copyBtn.classList.add('show');
      steps.classList.add('show');

      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => {
          copyBtn.textContent = '✓ Kopyalandı!';
          setTimeout(() => { copyBtn.textContent = '📋 Kodu Kopyala'; }, 2000);
        });
      });
    } else {
      loader.classList.remove('show');
      errorBox.classList.add('show');
      errorMsg.textContent = 'Authorization code bulunamadı. URL\'de ?code= parametresi yok.';
    }

    if (window.location.hash) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const hashCode = hashParams.get('access_token');
      if (hashCode && !code) {
        loader.classList.remove('show');
        codeBox.classList.add('show');
        authCode.textContent = 'access_token: ' + hashCode;
        copyBtn.classList.add('show');
      }
    }
  </script>
</body>
</html>
